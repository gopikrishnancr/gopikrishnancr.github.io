        <g latexdraw:type="text" id="id25232455" fill="white" latexdraw:position="bl">
            <text x="692.0" y="64.0">$\bf \mu \Delta^2 u + \dfrac{\partial}{\partial x} \left( -\Delta u \dfrac{\partial u}{\partial y}\right) - \dfrac{\partial}{\partial y} \left( -\Delta u \dfrac{\partial u}{\partial x}\right)=0$</text>
        </g>
        <g latexdraw:type="text" id="id13158459" fill="white" latexdraw:position="bl">
            <text x="743.578947368421" y="116.94736842105266">\large{$W^{k,p}(\mathbb{R}^n) \subset W^{\ell,q}(\mathbb{R}^n)$}</text>
        </g>
        <g latexdraw:type="text" id="id7202225" fill="white" latexdraw:position="bl">
            <text x="920.5263157894738" y="174.94736842105266">$\dfrac{1}{p} - \dfrac{k}{n} = \dfrac{1}{q} - \dfrac{\ell}{n}$</text>
        </g>
        <g latexdraw:type="text" id="id17342200" fill="white" latexdraw:position="bl">
            <text x="698.2105263157895" y="220.31578947368422">$\displaystyle \inf_{q \in Q, q\not= 0} \sup_{v \in V, v \not= 0} \dfrac{b(v,q)}{\| v\| \|q \|} \ge \beta_{\rm LBB}$</text>
        </g>
        <g latexdraw:type="text" id="id21645452" fill="white" latexdraw:position="bl">
            <text x="591.8947368421052" y="159.89473684210526">$-\mathrm{div}(\alpha \epsilon(\mathbf{u})) + \nabla p =-\nabla \mathscr{H}(\alpha)$</text>
        </g>
        <g latexdraw:type="text" id="id2828705" fill="white" latexdraw:position="bl">
            <text x="819.7894736842105" y="256.63157894736844">$\partial_t \alpha + \mathrm{div}(\alpha\boldsymbol{u})=\alpha f(\alpha, c)$</text>
        </g>
    </g>
